tests:
  # section.subsection
  tests.applications.etc-app.etc_device_record:
    timeout: 600
    platform_allow:
      - native_sim
      - etc_flex/nrf52840
    integration_platforms:
      - native_sim
    platform_exclude:
      - etc
  tests.applications.etc-app.etc_device_record.cbor:
    timeout: 600
    platform_allow:
      - native_sim
      - etc_flex/nrf52840
    integration_platforms:
      - native_sim
    extra_configs:
      - CONFIG_ZCBOR=y
      - CONFIG_ZCBOR_CANONICAL=y
      - CONFIG_ETC_RECORD_CBOR=y