CONFIG_ZTEST=y

# sensor_event.h pulls in the Application Event Manager headers.
CONFIG_APP_EVENT_MANAGER=y
CONFIG_APP_EVENT_MANAGER_LOG_EVENT_TYPE=n

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

# etc_sensor_sim.c registers its shell commands; the dummy backend keeps them
# off the console the test prints on.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_BACKEND_DUMMY=y
