description: quectel BG95 modem

compatible: "quectel,bg95"

include: uart-device.yaml

properties:
    mdm-on-off-gpios:
      type: phandle-array
      required: false

    mdm-power-gpios:
      type: phandle-array
      required: false
    
    mdm-pon-trig-gpios:
      type: phandle-array
      required: false

    mdm-psm-ind-gpios:
      type: phandle-array
      required: false

    mdm-uart-oe-gpios:
      type: phandle-array
      required: false

    mdm-reset-gpios:
      type: phandle-array
      required: false

    mdm-dtr-gpios:
      type: phandle-array
      required: false

    mdm-wdisable-gpios:
      type: phandle-array
      required: false
