description: Texas Instruments BQ25618/9 Singe Cell USB Charger

compatible: "ti,bq25618"

include: i2c-device.yaml

properties:
    max-current:
      type: int
      required: true
      description: Input current limit (mA)

    min-voltage:
      type: int
      required: true
      description: Minimum input voltage limit (mV)

    charge-current:
      type: int
      required: true
      description: Maximum current during fast charging (mA)

    precharge-current:
      type: int
      required: false
      description: The current during precharging (VBAT less than 3.0V) (mA)

    charge-voltage:
      type: int
      required: true
      description: Charging cut-off voltage (mV)
    
    has-charge-timer:
      type: boolean
      description: Enable the charging timer

    charge-timer-val:
      type: int
      default: 8
      description: Charging timer value (hours)

    int-gpios:
      type: phandle-array
      required: false
      description: |
        The INT signal defaults to active low open drain, so requires a
        pull-up on the board. It acts as an output and signals
        specific events happening (e.g. change in State of Charge).
