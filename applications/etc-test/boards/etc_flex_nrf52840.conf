CONFIG_BQ25618=y

# Partition Manager
CONFIG_PM_OVERRIDE_EXTERNAL_DRIVER_CHECK=y
CONFIG_PM_PARTITION_REGION_SETTINGS_STORAGE_EXTERNAL=n
CONFIG_PM_PARTITION_REGION_NVS_STORAGE_EXTERNAL=y

# MCUBOOT
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y

# Settings - Used to store real-time device configuration to flash.
CONFIG_SETTINGS=y
CONFIG_SETTINGS_FCB=y
CONFIG_FCB=y

# Non-volatile Storage
CONFIG_NVS=y

CONFIG_SENSOR=y
CONFIG_W1=y
CONFIG_EXACT_DS2484=y
CONFIG_W1_NET=y
CONFIG_TMP1826=y

CONFIG_ONEWIRE_I2C=y
CONFIG_ONEWIRE_I2C_LOG_LEVEL_INF=y
CONFIG_SENSOR_SHELL=y
CONFIG_SHT31=y
CONFIG_SENSOR_LOG_LEVEL_DBG=y
CONFIG_SHT3XD_SINGLE_SHOT_MODE=y

