# General config
CONFIG_ASSERT=y
CONFIG_REBOOT=y
CONFIG_RESET_ON_FATAL_ERROR=y
CONFIG_FPU=y
CONFIG_FW_INFO=y

# Disable boot banner. printk outputs get dropped w/ usbcdc
CONFIG_BOOT_BANNER=n
# Heap and stacks
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2304

CONFIG_LOG=y

# CONFIG_SHELL=y
# CONFIG_SHELL_VT100_COLORS=n
# CONFIG_SHELL_LOG_LEVEL_INF=y
# CONFIG_SHELL_BACKEND_SERIAL=y
# CONFIG_SHELL_BACKEND_SERIAL_INIT_PRIORITY=51
# CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=128
# CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=y

CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="ETC USB Shell"
CONFIG_USB_CDC_ACM_LOG_LEVEL_INF=y
CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETCHAR=y
CONFIG_CONSOLE_PUTCHAR_BUFSIZE=512
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_LORA=y
CONFIG_LORA_SX127X=y