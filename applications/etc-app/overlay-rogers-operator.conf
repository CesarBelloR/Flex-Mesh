# Prefer Rogers (302720) via the SIM preferred operator list (AT+CPOL).
# Operator selection stays automatic, so the device still attaches elsewhere
# when Rogers is out of range. Test feature - not for production.
CONFIG_MODEM_QUECTEL_BG95_M3_PREFERRED_OPERATOR=y
CONFIG_MODEM_QUECTEL_BG95_M3_PREFERRED_OPERATOR_PLMN="302720"

# The modem re-attaches to the stored RPLMN before it consults the list.
# Enable to force the next search to use the list, at the cost of a full
# all-band scan.
CONFIG_MODEM_QUECTEL_BG95_M3_PREFERRED_OPERATOR_CLEAR_RPLMN=y
