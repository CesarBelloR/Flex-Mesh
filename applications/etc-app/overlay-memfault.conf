CONFIG_MEMFAULT=y
CONFIG_MEMFAULT_NCS_PROJECT_KEY="Q8v2I0K0GdXFd8T8VBqzC4NGbfBGyD3H"
CONFIG_MEMFAULT_NCS_LTE_METRICS=n
CONFIG_MEMFAULT_NCS_STACK_METRICS=n
CONFIG_MEMFAULT_NCS_BT_METRICS=n
CONFIG_MEMFAULT_NCS_DEVICE_ID_RUNTIME=n
CONFIG_MEMFAULT_DEVICE_INFO_CUSTOM=y
CONFIG_MEMFAULT_ETC=y
CONFIG_MEMFAULT_LOGGING_ENABLE=y
CONFIG_MEMFAULT_LOG_LEVEL_DBG=y
CONFIG_MEMFAULT_HTTP_ENABLE=y
CONFIG_MEMFAULT_ROOT_CERT_STORAGE_CUSTOM=y
CONFIG_MEMFAULT_SHELL=y

CONFIG_MEMFAULT_COREDUMP_COLLECT_BSS_REGIONS=y

# Increase the stack size of the system workqueue in case Memfault is enabled. If the debug module
# is configured to forward Memfault data via an external transport the data will be carried on
# the system workqueue using Application Event Manager events.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=5120
CONFIG_DEBUG_MODULE=y

# Increase the event storage size so that all metrics generated by the asset tracker application
# are reliably sent to the memfault cloud.
CONFIG_MEMFAULT_EVENT_STORAGE_SIZE=2048

CONFIG_DEBUG_MODULE_MEMFAULT_HEARTBEAT_INTERVAL_SEC=3600
CONFIG_DEBUG_MODULE_MEMFAULT_UPDATES_MIN_INTERVAL_SEC=3600

# Store coredump to flash
CONFIG_MEMFAULT_NCS_INTERNAL_FLASH_BACKED_COREDUMP=y
CONFIG_MEMFAULT_COREDUMP_COLLECT_BSS_REGIONS=y


# Obsolete but needed for successful compile
CONFIG_MEMFAULT_NCS_FW_VERSION_PREFIX="0"
CONFIG_MEMFAULT_NCS_HW_VERSION="0"
CONFIG_MEMFAULT_NCS_FW_TYPE="0"
CONFIG_MEMFAULT_NCS_DEVICE_ID="0"