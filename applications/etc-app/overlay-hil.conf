# Hardware-in-the-loop (HIL) test hooks. Kept out of debug.conf so normal debug
# builds don't carry the test-only shell command overhead. Apply this overlay
# only when building firmware to run the tests under tests/hil/.

# Inject HALL/magnet-swipe events and query rail-settling state from the shell
# (magnet swipe / magnet status) for the FW-492 settling test.
CONFIG_ETC_INTERFACE_TEST_SHELL=y

# Drive the calibration state machine directly from the shell (calibration init /
# calibration run) so the calibration bug-fix HIL tests (FW-588/611/612/613) can
# reach a deterministic state (e.g. a completed-but-not-uploaded result to
# exercise the FW-611 re-entry guard) without depending on cloud connectivity.
CONFIG_CALIBRATION_MODULE_SHELL=y
