#CONFIG_BOOT_SIGNATURE_TYPE_NONE=y
CONFIG_BOOT_SIGNATURE_TYPE_RSA=y
CONFIG_BOOT_SIGNATURE_KEY_FILE="root-rsa-2048.pem"
CONFIG_DISABLE_FLASH_PATCH=y
CONFIG_MCUBOOT_LOG_LEVEL_DBG=y
CONFIG_BOOT_MAX_IMG_SECTORS=256

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_JESD216_API=y
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

CONFIG_PARTITION_MANAGER_ENABLED=y
CONFIG_FLASH_MAP_CUSTOM=y

CONFIG_PM_EXTERNAL_FLASH_MCUBOOT_SECONDARY=y
CONFIG_PM_PARTITION_SIZE_MCUBOOT=0x10000

CONFIG_I2C=n
CONFIG_SENSOR=n
CONFIG_SERIAL=y
# CONFIG_UART_CONSOLE=y
CONFIG_MULTITHREADING=y

# ADC
CONFIG_ADC=n

# Ensure an MCUboot-compatible binary is generated.
CONFIG_DEBUG=n
CONFIG_SHELL=n

CONFIG_UART_CONSOLE=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_RTT=y
# Minimal log mode needs to be disabled for RTT log backend
CONFIG_LOG_MODE_MINIMAL=n
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_LOG_BACKEND_UART=n

CONFIG_MAIN_STACK_SIZE=10240
CONFIG_PM=n
# Necessary to set LED status during firmware update.
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_PWM_SHELL=n
CONFIG_MCUBOOT_ACTION_HOOKS=y
CONFIG_ETC_MCUBOOT_ACTION_HOOK=y

# Disable BLE
CONFIG_BT=n