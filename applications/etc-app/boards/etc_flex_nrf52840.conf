# Network
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NRF_MODEM_LIB=n
CONFIG_NET_LOG=y

CONFIG_MODEM=y
CONFIG_MODEM_QUECTEL_BG95_M3=y
CONFIG_MODEM_QUECTEL_BG95_M3_APN="iot.1nce.net"
CONFIG_MODEM_QUECTEL_BG95_PSM_AUTO=y
CONFIG_MODEM_CMD_HANDLER_MAX_PARAM_COUNT=9
CONFIG_NET_SOCKETS_OFFLOAD=y
# Increase modem connection timeout to 10 minutes. Can be tightened later after testing.
CONFIG_MODEM_MODULE_MAX_CONNECTION_TIME_S=600
# CONFIG_NET_SOCKETS_SOCKOPT_TLS is not required with Zephyr versions >=3.0
# when using offloaded sockets.
# CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
# CONFIG_NET_SOCKETS_OFFLOAD_TLS=y

CONFIG_LOG_BUFFER_SIZE=4096

# Heap and stacks
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# MCUBOOT
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y

# Settings - Used to store real-time device configuration to flash.
CONFIG_SETTINGS=y
CONFIG_SETTINGS_FCB=y
CONFIG_FCB=y

# Non-volatile Storage
CONFIG_NVS=y

# Enable statistics and statistic names.
CONFIG_STATS=y
CONFIG_STATS_NAMES=y

# Disable boot banner. printk outputs get dropped w/ usbcdc
CONFIG_BOOT_BANNER=n

# Enable mcumgr.
CONFIG_MCUMGR=y

# Enable most core commands.
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_STAT=y
CONFIG_MCUMGR_GRP_SHELL=y
CONFIG_MCUMGR_TRANSPORT_UART=y
CONFIG_MCUMGR_TRANSPORT_SHELL=y
CONFIG_MCUMGR_GRP_IMG_LOG_LEVEL_DBG=y
CONFIG_MCUMGR_GRP_IMG_STATUS_HOOKS=y
CONFIG_MCUMGR_SMP_COMMAND_STATUS_HOOKS=y
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
# Dummy shell backend is required for TRANSPORT_SHELL mcumgr option
CONFIG_SHELL_BACKEND_DUMMY=y

# Enable MCUMGR for ETC
CONFIG_MCUMGR_CMD_ETC_MGMT=y

# enable storage erase for mcumgr (needed for OTA for BLE)
CONFIG_MCUMGR_GRP_ZBASIC=y
CONFIG_MCUMGR_GRP_ZBASIC_STORAGE_ERASE=y

CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_AUTHEN=n
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y

# CJSON
CONFIG_CJSON_LIB=y

# Peripherals
CONFIG_ADC=y
CONFIG_ADC_MODULES=y
CONFIG_PCF85263=y
CONFIG_DS18B20_TIMER=y

# GUI over LED
CONFIG_UI_MODULE=y
CONFIG_UI_LED_USE_PWM=y

# Partition Manager
CONFIG_PM_OVERRIDE_EXTERNAL_DRIVER_CHECK=y
CONFIG_PM_PARTITION_REGION_SETTINGS_STORAGE_EXTERNAL=n
CONFIG_PM_PARTITION_REGION_NVS_STORAGE_EXTERNAL=y

# PMIC
CONFIG_SENSOR=y
CONFIG_BQ25618=y

# Shell interface
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKEND_DUMMY_BUF_SIZE=512
CONFIG_DATE_SHELL=n
CONFIG_FLASH_SHELL=n
# HW Interface
CONFIG_ETC_INTERFACE=y

# ETC Settings
CONFIG_ETC_SETTINGS=y

# LoRa config
CONFIG_LORA=y
CONFIG_LORA_SX127X=y
CONFIG_ETC_LORA_MODULE=y

# Enable Power Management module
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# GNSS configuration
CONFIG_GNSS=y
CONFIG_GNSS_DUMP_TO_LOG=y
CONFIG_GNSS_PARSE=y

CONFIG_MODEM_QUECTEL_BG95_M3_GNSS=y
CONFIG_MODEM_QUECTEL_BG95_M3_GNSS_SHELL=y

# Enable GPIO Hogs
CONFIG_GPIO_HOGS=y
CONFIG_GPIO_HOGS_INIT_PRIORITY=70