# Network
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NRF_MODEM_LIB=n
CONFIG_NET_LOG=y

CONFIG_MODEM=y
CONFIG_MODEM_QUECTEL_BG95_M3=y
CONFIG_MODEM_QUECTEL_BG95_M3_APN="teal"
CONFIG_MODEM_QUECTEL_BG95_PSM=y
CONFIG_MODEM_CMD_HANDLER_MAX_PARAM_COUNT=9
CONFIG_NET_SOCKETS_OFFLOAD=y
# CONFIG_NET_SOCKETS_SOCKOPT_TLS is not required with Zephyr versions >=3.0
# when using offloaded sockets.
# CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
# CONFIG_NET_SOCKETS_OFFLOAD_TLS=y

CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_NET_LOG=y

# Heap and stacks
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# MCUBOOT
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y

# Settings - Used to store real-time device configuration to flash.
CONFIG_SETTINGS=y
CONFIG_SETTINGS_FCB=y
CONFIG_FCB=y

# Non-volatile Storage
CONFIG_NVS=y

# Enable statistics and statistic names.
CONFIG_STATS=y
CONFIG_STATS_NAMES=y

# Disable boot banner. printk outputs get dropped w/ usbcdc
CONFIG_BOOT_BANNER=n

# Enable mcumgr.
CONFIG_MCUMGR=y

# Enable most core commands.
CONFIG_MCUMGR_CMD_IMG_MGMT=y
CONFIG_MCUMGR_CMD_OS_MGMT=y
CONFIG_MCUMGR_CMD_STAT_MGMT=y
CONFIG_MCUMGR_CMD_SHELL_MGMT=y
CONFIG_MCUMGR_SMP_UART=y
CONFIG_MCUMGR_SMP_SHELL=y

# Enable MCUMGR for ETC
CONFIG_MCUMGR_CMD_ETC_MGMT=y

# enable storage erase for mcumgr (needed for OTA for BLE)
CONFIG_MCUMGR_GRP_ZEPHYR_BASIC=y
CONFIG_MCUMGR_GRP_BASIC_CMD_STORAGE_ERASE=y

# CJSON
CONFIG_CJSON_LIB=y

# Peripherals
CONFIG_ADC=y
CONFIG_ADC_MODULES_SAMPLE_RATE_MSEC=30000
CONFIG_ADC_MODULES=y
CONFIG_PCF85263=y
CONFIG_DS18B20_TIMER=y

# GUI over LED
CONFIG_UI_MODULE=y
CONFIG_UI_LED_USE_PWM=y

# Bluetooth
# CONFIG_BT=y
# CONFIG_BT_CTLR=y

# Partition Manager
CONFIG_PM_OVERRIDE_EXTERNAL_DRIVER_CHECK=y
CONFIG_PM_PARTITION_REGION_SETTINGS_STORAGE_EXTERNAL=y
CONFIG_PM_PARTITION_REGION_NVS_STORAGE_EXTERNAL=y

# PMIC
CONFIG_SENSOR=y
CONFIG_BQ25618=y

# Shell interface
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_BACKEND_DUMMY_BUF_SIZE=512
CONFIG_DATE_SHELL=n
# HW Interface
CONFIG_ETC_INTERFACE=y

# ETC Settings
CONFIG_ETC_SETTINGS=y

# LoRa config
CONFIG_LORA=y
CONFIG_LORA_SX12XX=y
CONFIG_ETC_LORA_MODULE=y

# Enable Power Management module
CONFIG_PM=y
CONFIG_PM_DEVICE=y