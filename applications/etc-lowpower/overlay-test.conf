# Enable runtime power management
CONFIG_PM_DEVICE_RUNTIME=y

# Enable Serial
CONFIG_SERIAL=y

# Enable flash operations.
CONFIG_FLASH=y
CONFIG_SPI_NOR=y
CONFIG_FLASH_JESD216_API=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_SOC_FLASH_NRF_UICR=y
CONFIG_FLASH_MAP=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_FCB=y

# Enable USB
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="ETC USB Shell"
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKENDS=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKEND_SERIAL_INIT_PRIORITY=51

# GUI over LED
# CONFIG_UI_MODULE=y
# CONFIG_UI_LED_USE_PWM=y
# CONFIG_UI_LOG_LEVEL_WRN=y

# ADC
CONFIG_ADC=y
CONFIG_ADC_MODULES=y
CONFIG_ADC_MODULES_SAMPLE_RATE_MSEC=30000

# SoC
CONFIG_FPU=y

# Libs
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=y

CONFIG_ASSERT=y

CONFIG_FW_INFO=y

CONFIG_MCUMGR=y
CONFIG_ZCBOR=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y

CONFIG_NET_BUF=y

CONFIG_CJSON_LIB=y


# Kernel
CONFIG_HEAP_MEM_POOL_SIZE=4096

CONFIG_LOG=y

CONFIG_EARLY_CONSOLE=n

# Devices (and related)
CONFIG_SENSOR=y

CONFIG_BQ25618=y
CONFIG_BQ25618_LOG_LEVEL_DBG=y

CONFIG_PCF85263_WATCHDOG_FEED_INTERNAL_SECONDS=10

CONFIG_DS2484=y

CONFIG_DS18B20_TIMER=y

CONFIG_UI_MODULE=y
CONFIG_PWM=y
CONFIG_UI_LED_USE_PWM=y

CONFIG_BT=y
CONFIG_BT_HCI=y
CONFIG_BT_PERIPHERAL=y
