name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    branches:
      - main
      - v*
      - RC/*
      - dev

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
          claude_args: '--model opus --allowedTools "Bash(gh:*)" "Bash(git:*)"'

      # Fail the job if the review did not actually complete: the action step
      # errored (e.g. Claude authentication failed), no execution log was
      # produced, Claude reported an error, or any tool call was denied
      # (permission_denials_count > 0 means findings could not be posted).
      - name: Verify review completed
        if: always()
        env:
          STEP_OUTCOME: ${{ steps.claude-review.outcome }}
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: ./.github/scripts/verify-claude-review.sh