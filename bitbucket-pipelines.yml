# Additional resources for Zephyr CI:
## https://gitlab.com/zygoon/zephyr-ci-pipelines
## https://github.com/circuitdojo/nrf9160-feather-examples-and-drivers/blob/v1.7.x/.github/workflows/build.yml
## https://github.com/zephyrproject-rtos/zephyr/tree/main/.github/workflows

image: ghcr.io/zephyrproject-rtos/ci:v0.24.6

clone:
  depth: 1

# definitions:
#   caches:
#     zephyr: ../monitor/

pipelines:
  pull-requests:
    '**':
      - step:
          name: 'Setup'
          # ToDo: add caching for Zephyr modules, so they don't need
          # to be downloaded every time.
          # caches:
          #   - zephyr
          script:
            - export BITBUCKET_COMMIT_SHORT="${BITBUCKET_COMMIT::7}"
            - git config --global user.email "you@example.com"
            - git config --global user.name "Your Name"
            - pip3 install memfault-cli
            
            - west init -l .
            - west update
            # Apply patches
            - ./scripts/apply_patches.sh
            - mkdir -p .out/update
            ## Build for ETC HW v0.3.0
            ### Build application without extra options
            - west build -b etc@0.3.0 -s applications/etc-app -p
            - cp build/zephyr/merged.hex ".out/monitor2.0_etc_0_3_0_vX.X.X_${BITBUCKET_COMMIT_SHORT}.hex"
            - cp build/zephyr/app_update.bin ".out/update/update_monitor2.0_etc_0_3_0_vX.X.X_${BITBUCKET_COMMIT_SHORT}.bin"
            ### Build for 1NCE SIM and RTT debug output
            - west build -b etc@0.3.0 -s applications/etc-app -p -- -DOVERLAY_CONFIG="debug.conf rtt.conf overlay-1nce.conf"
            - cp build/zephyr/merged.hex ".out/monitor2.0_etc_0_3_0_vX.X.X_${BITBUCKET_COMMIT_SHORT}_debug.hex"
            - cp build/zephyr/app_update.bin ".out/update/update_monitor2.0_etc_0_3_0_vX.X.X_${BITBUCKET_COMMIT_SHORT}_debug.bin"
            ### Build for 1NCE SIM and RTT debug output with Memfault support
            - west build -b etc@0.3.0 -s applications/etc-app -p -- -DOVERLAY_CONFIG="debug.conf rtt.conf overlay-memfault.conf overlay-1nce.conf"
            # Upload to Memfault
            - > 
              memfault 
              --org-token ${MEMFAULT_ORG_TOKEN}
              --org ${MEMFAULT_ORG}
              --project ${MEMFAULT_PROJECT}
              upload-mcu-symbols
              build/zephyr/zephyr.elf
            - cp build/zephyr/merged.hex ".out/monitor2.0_etc_0_3_0_vX.X.X_${BITBUCKET_COMMIT_SHORT}_debug_memfault.hex"
            - cp build/zephyr/zephyr.elf ".out/monitor2.0_etc_0_3_0_vX.X.X_${BITBUCKET_COMMIT_SHORT}_debug_memfault.elf"
            - cp build/zephyr/app_update.bin ".out/update/update_monitor2.0_etc_0_3_0_vX.X.X_${BITBUCKET_COMMIT_SHORT}_debug_memfault.bin"
            ### Build for 1NCE SIM and USB debug output with Memfault support
            - west build -b etc@0.3.0 -s applications/etc-app -p -- -DOVERLAY_CONFIG="debug.conf overlay-memfault.conf overlay-1nce.conf"
            - cp build/zephyr/merged.hex ".out/monitor2.0_etc_0_3_0_vX.X.X_${BITBUCKET_COMMIT_SHORT}_debug_memfault_usb.hex"
            - cp build/zephyr/zephyr.elf ".out/monitor2.0_etc_0_3_0_vX.X.X_${BITBUCKET_COMMIT_SHORT}_debug_memfault_usb.elf"
            - cp build/zephyr/app_update.bin ".out/update/update_monitor2.0_etc_0_3_0_vX.X.X_${BITBUCKET_COMMIT_SHORT}_debug_memfault_usb.bin"
            ### Build etc-test
            - mkdir .out/etc-test
            - west build -b etc@0.3.0 -s applications/etc-test -p
            - cp build/zephyr/merged.hex ".out/etc-test/etc-test_etc_0_3_0_${BITBUCKET_COMMIT_SHORT}.hex"
          artifacts:
            - .out/**

  custom:
    clear-cache:
      - step:
          image: atlassian/default-image:latest
          script:
            - pipe: atlassian/bitbucket-clear-cache:3.2.0
              variables:
                BITBUCKET_USERNAME: $BITBUCKET_USERNAME
                BITBUCKET_APP_PASSWORD: $BITBUCKET_APP_PASSWORD



