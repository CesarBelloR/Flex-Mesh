# Additional resources for Zephyr CI:
## https://gitlab.com/zygoon/zephyr-ci-pipelines
## https://github.com/circuitdojo/nrf9160-feather-examples-and-drivers/blob/v1.7.x/.github/workflows/build.yml
## https://github.com/zephyrproject-rtos/zephyr/tree/main/.github/workflows

image: ghcr.io/zephyrproject-rtos/ci:v0.24.6

clone:
  depth: 1

# definitions:
#   caches:
#     zephyr: ../monitor/

pipelines:
  pull-requests:
    '**':
      - step:
          name: 'Setup'
          # ToDo: add caching for Zephyr modules, so they don't need
          # to be downloaded every time.
          # caches:
          #   - zephyr
          script:
            - export BITBUCKET_COMMIT_SHORT="${BITBUCKET_COMMIT::7}"
            - git config --global user.email "you@example.com"
            - git config --global user.name "Your Name"
            - pip3 install memfault-cli
            - pip3 install imgtool==2.0.0
            
            - west init -l .
            - west update
            # Apply patches
            - ./scripts/apply_patches.sh
            - mkdir -p .out/update
            ## Build for ETC HW v0.3.0
            ### Build application without extra options
            - west build -b etc@0.3.0 -s applications/etc-app -p
            ### Build for 1NCE SIM and RTT debug output
            - west build -b etc@0.3.0 -s applications/etc-app -p -- -DOVERLAY_CONFIG="debug.conf rtt.conf overlay-1nce.conf"
            ### Build for 1NCE SIM and RTT debug output with Memfault support
            #### Build with new production key
            # Write private key stored as secret to file
            - echo ${MCUBOOT_PRIVATE_KEY_BASE64} | base64 --decode > mcuboot.pem
            - export MCUBOOT_KEY_PATH="$(realpath mcuboot.pem)"
            - >
              west build -b etc@0.3.0 -s applications/etc-app -p -- 
              -DOVERLAY_CONFIG="debug.conf rtt.conf overlay-memfault.conf overlay-1nce.conf"
              -Dmcuboot_CONFIG_BOOT_SIGNATURE_KEY_FILE=\"${MCUBOOT_KEY_PATH}\"
            # Upload to Memfault
            - > 
              memfault 
              --org-token ${MEMFAULT_ORG_TOKEN}
              --org ${MEMFAULT_ORG}
              --project ${MEMFAULT_PROJECT}
              upload-mcu-symbols
              build/zephyr/zephyr.elf
            # Retrieve pubkey ID from generated image and store in environment variable
            - >
              export PUBKEY_ID=$(python scripts/imgtools/etc_imgtool.py pubkeyid build/zephyr/app_update.bin)
            # Copy compiled files to artifact output folder.
            # File name: flex_<short commit ID>_pubkeyid-<public key ID>
            # public key id: First 4 bytes in hex of the hash of the public 
            #   mcuboot key that is required to boot this image.
            - cp build/zephyr/merged.hex ".out/flex_${BITBUCKET_COMMIT_SHORT}_pubkeyid-${PUBKEY_ID}.hex"
            - cp build/zephyr/zephyr.elf ".out/flex_${BITBUCKET_COMMIT_SHORT}_pubkeyid-${PUBKEY_ID}.elf"
            - cp build/zephyr/app_update.bin ".out/update/update_flex_${BITBUCKET_COMMIT_SHORT}_pubkeyid-${PUBKEY_ID}.bin"
            #### Build with old production key
            - rm -r build/
            - >
              west build -b etc@0.3.0 -s applications/etc-app -p -- 
              -DOVERLAY_CONFIG="debug.conf rtt.conf overlay-memfault.conf overlay-1nce.conf"
            # Upload to Memfault
            - > 
              memfault 
              --org-token ${MEMFAULT_ORG_TOKEN}
              --org ${MEMFAULT_ORG}
              --project ${MEMFAULT_PROJECT}
              upload-mcu-symbols
              build/zephyr/zephyr.elf
            # Retrieve pubkey ID from generated image and store in environment variable
            # Retrieve pubkey ID from generated image and store in environment variable
            - >
              export PUBKEY_ID=$(python scripts/imgtools/etc_imgtool.py pubkeyid build/zephyr/app_update.bin)
            # Only create update binary and hex for default key. This should
            # never be flashed during production anymore.

            # Copy compiled files to artifact output folder.
            # File name: flex_<short commit ID>_pubkeyid-<public key ID>
            # public key id: First 4 bytes in hex of the hash of the public 
            #   mcuboot key that is required to boot this image.
            - mkdir .out/test
            - cp build/zephyr/app_signed.hex ".out/test/update_test_flex_${BITBUCKET_COMMIT_SHORT}_pubkeyid-${PUBKEY_ID}.hex"
            - cp build/zephyr/app_update.bin ".out/update/update_flex_${BITBUCKET_COMMIT_SHORT}_pubkeyid-${PUBKEY_ID}.bin"
            ### Build for 1NCE SIM and USB debug output with Memfault support
            - west build -b etc@0.3.0 -s applications/etc-app -p -- -DOVERLAY_CONFIG="debug.conf overlay-memfault.conf overlay-1nce.conf"
            ### Build etc-test
            - mkdir .out/etc-test
            - west build -b etc@0.3.0 -s applications/etc-test -p
            - cp build/zephyr/merged.hex ".out/etc-test/etc-test_${BITBUCKET_COMMIT_SHORT}.hex"
          artifacts:
            - .out/**

  custom:
    clear-cache:
      - step:
          image: atlassian/default-image:latest
          script:
            - pipe: atlassian/bitbucket-clear-cache:3.2.0
              variables:
                BITBUCKET_USERNAME: $BITBUCKET_USERNAME
                BITBUCKET_APP_PASSWORD: $BITBUCKET_APP_PASSWORD



